name: Python Flask App CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WAQI_TOKEN: "ci-placeholder-token"
      SECRET_KEY: "ci-test-secret-key"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask Flask-SQLAlchemy Flask-Caching gunicorn scikit-learn \
                    pandas numpy joblib xgboost statsmodels python-dotenv flask-limiter

    - name: Syntax check (py_compile)
      run: |
        python -m py_compile app.py
        python -m py_compile advanced_model.py
        echo "Syntax check passed."

    - name: Import check
      run: |
        # Verify all top-level imports resolve correctly without needing model files
        python -c "
        import sys, types

        # Stub out joblib.load so app-level model loading doesn't crash
        import joblib
        joblib.load = lambda *a, **kw: types.SimpleNamespace(predict=lambda x: [0])

        # Stub open() only for the specific files loaded at module level
        import builtins
        _real_open = builtins.open
        def _patched_open(path, *a, **kw):
            if 'feature_columns.json' in str(path):
                import io, json
                return io.StringIO(json.dumps(['pm25','pm10','no2','so2','co','o3']))
            return _real_open(path, *a, **kw)
        builtins.open = _patched_open

        # Stub pandas CSV load
        import pandas as pd
        pd.read_csv = lambda *a, **kw: pd.DataFrame()

        import app
        print('All imports resolved successfully.')
        "
